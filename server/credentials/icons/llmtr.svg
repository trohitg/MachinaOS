<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="LLMTR">
  <title>LLMTR</title>
  <!--
    LLMTR's own mark (crescent + star), path data taken verbatim from
    https://llmtr.com/favicon.svg. Two deliberate changes:

    1. Re-framed as a self-contained 24x24 tile with the brand navy as the
       background, rather than transparent artwork. That is the pattern the
       other backend-served credential icons already use (see sarvam.svg),
       and it is what makes the mark legible on all 12 canvas themes —
       the source favicon relies on `prefers-color-scheme` to flip its navy
       fill to white, which resolves against the OS setting and so goes
       invisible on a dark-navy panel under a light OS.
    2. The `<g transform>` maps the source content bbox (x 16..50.76,
       y 7..29) into the tile's 18x18 inner box, preserving aspect ratio.
       The source viewBox is "14 6 38 24" — non-square, so rendering it
       directly into the square icon slots here would squash it.
  -->
  <rect width="24" height="24" rx="5" fill="#0F172A"/>
  <g transform="translate(-5.285 2.675) scale(0.5178)">
    <path
      d="M 38 18 A 11 11 0 1 0 16 18 A 11 11 0 1 0 38 18 Z M 38 18 A 8 8 0 1 0 22 18 A 8 8 0 1 0 38 18 Z"
      fill="#F8FAFC"
      fill-rule="evenodd"
    />
    <polygon
      points="46,13 47.12,16.45 50.76,16.45 47.82,18.59 48.94,22.05 46,19.91 43.06,22.05 44.18,18.59 41.24,16.45 44.88,16.45"
      fill="#EF4444"
    />
  </g>
</svg>
